# Is the committed generated code what the generators produce?
#
# Two things in this tree are generated and committed, for the same reason in
# both cases: so that a clone builds without the tool that made them.
#
#   src/core/gs_tables.h   the trig tables, because a table built at start-up is
#                          a table a different libm can build differently, and
#                          the whole simulation is downstream of that
#   src/ui/dcimgui/        the C API over Dear ImGui, because generating it at
#                          build time would put Python and ply between every
#                          contributor and a working build
#   src/gfx/gs_meshes.c    the vehicles, because they are generated from
#                          parameters rather than modelled, and the attribution
#                          is written in the same run - a licence statement that
#                          can drift from the art it describes is worse than
#                          none
#   assets/tracks/         the stock tracks, chosen out of the generator by
#                          racing them, so the set is reproducible from the seeds
#   assets/server/         the library a server ships with, so a server nobody
#                          has set up still has something to offer - and so a
#                          schema change that forgets it fails here rather than
#                          in somebody's hands
#
# The cost of committing them is a promise nobody can see: that the files really
# are what the generators write from the pinned inputs. This is the job that
# keeps it honest.
name: generated

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/make_tables.py'
      - 'tools/make_tracks.c'
      - 'tools/make_store.c'
      - 'src/core/gs_generate.c'
      - 'src/net/gs_store.c'
      - 'assets/tracks/**'
      - 'assets/server/**'
      # **And the simulation itself.** Which generated tracks are good enough
      # to ship is decided by racing them - every vehicle has to be able to
      # finish - so a change to the physics or to the driver changes the set,
      # and none of the paths above moves when that happens. It went unnoticed
      # for four commits: the shipped set was two tracks short of what the
      # chooser produces, because two seeds became finishable and nothing
      # re-ran the choosing.
      - 'src/core/**'
      - 'tools/make_imgui_bindings.py'
      - 'tools/make_meshes.py'
      - 'src/core/gs_tables.h'
      - 'src/ui/dcimgui/**'
      - 'src/gfx/gs_meshes.c'
      - 'assets/ATTRIBUTION.md'
      - '.gitmodules'
      - '.github/workflows/tables.yml'
  pull_request:
    paths:
      - 'tools/make_tables.py'
      - 'tools/make_tracks.c'
      - 'tools/make_store.c'
      - 'src/core/gs_generate.c'
      - 'src/net/gs_store.c'
      - 'assets/tracks/**'
      - 'assets/server/**'
      # **And the simulation itself.** Which generated tracks are good enough
      # to ship is decided by racing them - every vehicle has to be able to
      # finish - so a change to the physics or to the driver changes the set,
      # and none of the paths above moves when that happens. It went unnoticed
      # for four commits: the shipped set was two tracks short of what the
      # chooser produces, because two seeds became finishable and nothing
      # re-ran the choosing.
      - 'src/core/**'
      - 'tools/make_imgui_bindings.py'
      - 'tools/make_meshes.py'
      - 'src/core/gs_tables.h'
      - 'src/ui/dcimgui/**'
      - 'src/gfx/gs_meshes.c'
      - 'assets/ATTRIBUTION.md'
      - '.gitmodules'

jobs:
  tables:
    name: Trig tables
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: Re-bake
        run: python3 tools/make_tables.py

      - name: Diff
        run: |
          if ! git diff --exit-code -- src/core/gs_tables.h; then
            echo "::error::src/core/gs_tables.h is not what tools/make_tables.py produces."
            exit 1
          fi
          echo "The committed table is the baked table."

  meshes:
    name: Vehicle meshes and their attribution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: Re-generate
        run: python3 tools/make_meshes.py

      # Twice, and identically. A generator that is merely deterministic on one
      # run could still be reading a dictionary in whatever order it felt like;
      # running it again over its own output is what proves the art pipeline
      # reproduces rather than happens to have matched.
      - name: And again
        run: python3 tools/make_meshes.py

      - name: Diff
        run: |
          if ! git diff --exit-code -- src/gfx/gs_meshes.c assets/ATTRIBUTION.md; then
            echo "::error::The committed meshes or attribution are not what tools/make_meshes.py produces."
            exit 1
          fi
          echo "The committed art is the generated art, and the credits match it."

  imgui_bindings:
    name: Dear ImGui C bindings
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with: { submodules: false }

      # Both of them: the generator and the header it reads have to match, which
      # is exactly the pairing this job exists to police.
      - name: Check out the generator and its input
        run: git submodule update --init --depth 1 ext/imgui ext/dear_bindings

      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: Install the generator's dependency
        run: python3 -m pip install --upgrade "ply==3.11"

      - name: Re-bake
        run: python3 tools/make_imgui_bindings.py

      - name: Diff
        run: |
          if ! git diff --exit-code -- src/ui/dcimgui; then
            echo "::error::src/ui/dcimgui is not what tools/make_imgui_bindings.py"\
                 "produces from the pinned ext/imgui and ext/dear_bindings."
            exit 1
          fi
          echo "The committed bindings are the generated bindings."

      - name: Upload what was generated
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: freshly-generated-bindings
          path: src/ui/dcimgui

  stock_tracks:
    name: The stock tracks and the library that ships them
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with: { submodules: recursive }
      # gcc-14 for C23, as the main CI job does - the runner's default is 13.
      - name: Install ninja and a compiler that speaks C23
        run: sudo apt-get update && sudo apt-get install -y ninja-build gcc-14 g++-14

      # Neither tool needs a window, a sound device or a network, so only the two
      # that write the content are built. Configuring still walks through SDL,
      # which refuses a Unix build with no X11 or Wayland headers unless it is
      # told the build is deliberately headless - which this one is, and saying
      # so is cheaper than installing a desktop's worth of -dev packages to
      # compile two programs that never open a window.
      - name: Configure and build the tools
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
                -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14 \
                -DSDL_UNIX_CONSOLE_BUILD=ON \
                -DGEARSTICK_SQLITE_AMALGAMATION=ON
          cmake --build build --target gearstick_make_tracks gearstick_make_store

      # The tracks are chosen by racing them, so this also re-runs the choosing.
      # A generator change that quietly stopped a stock track being finishable
      # would change which tracks are picked, and that shows up as a diff.
      - name: Re-choose the stock tracks
        run: ./build/gearstick_make_tracks assets/tracks

      # The pinned SQLite, not the runner's. Identical rows laid out by two
      # versions are two different files, which no query can see and this diff
      # cannot miss - so the writer of a committed artefact is pinned, the same
      # way the trig table is pinned to the script that bakes it.
      - name: Rebuild the shipped library
        run: ./build/gearstick_make_store assets/server/gearstick.db assets/tracks/*.gstrack

      # Twice, because a database is a file format with a lot of room in it for
      # a timestamp or a page written in whatever order occurred to it. If the
      # second run differs from the first, the file cannot be committed at all
      # and this needs to be a build step instead.
      - name: And again
        run: ./build/gearstick_make_store assets/server/gearstick.db assets/tracks/*.gstrack

      - name: Diff
        run: |
          if ! git diff --exit-code -- assets/tracks assets/server; then
            echo "::error::The shipped tracks or library are not what the tools produce."
            exit 1
          fi
          echo "The shipped library is the built library, and the tracks are the chosen ones."
