# Does a package actually work?
#
# **A package is a folder somebody unpacks and runs**, so that is exactly what
# this checks: build it, unpack it somewhere else entirely, and run the thing
# out of the unpacked copy. Not "cpack exited zero" - that says nothing about
# whether the binary inside can find its own feet.
#
# Two runs per platform, deliberately:
#   - the headless driver re-races the golden replay, proving the simulation in
#     the package is the same simulation CI tested;
#   - the game writes a frame, proving the packaged layout is one that
#     src/platform/gs_paths.c can actually find assets in. That probe is easy to
#     get wrong and impossible to notice until somebody runs an installed copy.
#
# Not on every push: this builds SDL from source three times over, and packaging
# does not change when the physics does. On demand, on a tag, and whenever the
# packaging rules themselves change.
name: package

on:
  workflow_dispatch:
  push:
    tags: ['v*']
    paths:
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - '.github/workflows/package.yml'

env:
  # **What a release calls itself.** The tag without its leading `v`, or empty
  # when this is not a tag build - in which case CMake keeps the project's own
  # version and the file is named for that.
  #
  # This was written down in CMakeLists.txt as "set by the release job from the
  # tag" and no job ever set it, so a `v0.1.0-beta1` tag would have produced
  # files called `gearstick-0.1.0-...` with the beta marker gone. The comment
  # said exactly why that matters - somebody with the file in their downloads
  # folder needs to be able to tell - and the code did not do it.
  GS_RELEASE: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

  # ext/imgui too, now that the editor's panels are built on it. NOT
  # ext/dear_bindings: it generates the C API and the result is committed, so
  # building needs the header but not the generator. That asymmetry is the whole
  # point of committing the bindings, and this line is where it shows.
  CI_SUBMODULES: ext/sdl ext/imgui ext/sdl_net ext/libsodium

jobs:
  linux:
    name: Linux x86_64 tarball
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with: { submodules: false }
      - run: git submodule update --init --depth 1 $CI_SUBMODULES

      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # The runner image ships third-party apt sources - Microsoft, Google
          # Chrome - that this build has no use for. Globbed by name rather than
          # by filename, because the first attempt removed `google-chrome.list`
          # and the image had already moved to deb822 `.sources`; it looked
          # fixed and dl.google.com was still being fetched the next run.
          sudo rm -f /etc/apt/sources.list.d/*google* \
                     /etc/apt/sources.list.d/*microsoft* \
                     /etc/apt/sources.list.d/*azure* 2>/dev/null || true

          # The runner's own background apt jobs hold the dpkg lock and are a
          # documented cause of exactly this stall. They have nothing useful to
          # do while a build runs.
          sudo systemctl stop apt-daily.timer apt-daily-upgrade.timer \
                              unattended-upgrades.service 2>/dev/null || true

          # apt on GitHub's hosted runners stalls indefinitely, intermittently,
          # and it is their bug rather than ours - actions/runner-images#11382.
          # Two rounds of tuning Acquire options is how that was established:
          # timeouts, retries and ForceIPv4 were all still hanging. So it is
          # bounded from the outside and retried, which is the handling that
          # issue recommends and the only thing that works against a hang rather
          # than against a slow mirror.
          APT_OPTS="-o Acquire::Retries=3 \
                    -o Acquire::http::Timeout=30 \
                    -o Acquire::https::Timeout=30 \
                    -o Acquire::ForceIPv4=true \
                    -o DPkg::Lock::Timeout=60"

          apt_run() {
            for attempt in 1 2 3; do
              if sudo timeout 240 apt-get $APT_OPTS "$@"; then return 0; fi
              echo "::warning::apt attempt $attempt stalled; killing it and retrying"
              sudo pkill -9 -f apt-get 2>/dev/null || true
              sudo pkill -9 -f dpkg 2>/dev/null || true
              sudo rm -f /var/lib/apt/lists/lock /var/lib/dpkg/lock \
                         /var/lib/dpkg/lock-frontend 2>/dev/null || true
              sudo dpkg --configure -a 2>/dev/null || true
              sleep 10
            done
            echo "::error::apt would not complete in three attempts"
            return 1
          }

          apt_run update
          apt_run install -y --no-install-recommends \
            gcc-14 g++-14 ninja-build \
            libx11-dev libxext-dev libxrandr-dev libxi-dev libxcursor-dev \
            libxfixes-dev libxss-dev libxtst-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libdecor-0-dev \
            libgl-dev libegl-dev libdrm-dev libgbm-dev \
            libpulse-dev libasound2-dev \
            libdbus-1-dev libudev-dev libusb-1.0-0-dev

      - name: Build and package
        run: |
          rel="${GS_RELEASE#v}"
          extra=""
          if [ -n "$rel" ]; then extra="-DGEARSTICK_RELEASE=$rel"; fi
          echo "naming this release: ${rel:-the project version}"
          cmake -B build -G Ninja -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14 \
                -DCMAKE_BUILD_TYPE=RelWithDebInfo -DGEARSTICK_WERROR=ON $extra
          cmake --build build -j
          cd build && cpack

      - name: Unpack somewhere else and run it
        env:
          SDL_VIDEODRIVER: dummy
          SDL_RENDER_DRIVER: software
          SDL_AUDIO_DRIVER: dummy
        run: |
          mkdir -p /tmp/unpacked
          tar xzf build/gearstick-*-linux-*.tar.gz -C /tmp/unpacked
          cd /tmp/unpacked/gearstick-*
          ls -la
          ./gearstick_cli selftest --verify
          ./gearstick --shot packaged.bmp --shot-at 120
          test -s packaged.bmp || { echo "the packaged game drew nothing"; exit 1; }

      # **A machine that has never had a toolchain on it.** The runner has one,
      # so unpacking on the runner proves less than it looks: a package can
      # quietly depend on something only a build machine has and nobody finds
      # out until a player does. A bare container has no compiler, no CMake and
      # no SDL, which is what a release is actually for.
      #
      # **Ubuntu 24.04 rather than Debian 12, and that is a decision.** This
      # project is C23, and on a build machine with glibc 2.38 or newer the C23
      # headers redirect `sscanf`, `strtol` and friends to `__isoc23_*` symbols
      # that only exist from 2.38 onwards. So a binary built here cannot run on
      # anything older, and Debian 12 - glibc 2.36 - is older. That is not a
      # packaging fault to be worked around; it is the floor C23 sets, and the
      # honest response is to say so in docs/RELEASES.md and test against the
      # oldest image that actually meets it.
      - name: Run it on a machine with no toolchain
        run: |
          docker run --rm -v "$PWD/build:/pkg:ro" \
            -e SDL_VIDEODRIVER=dummy -e SDL_RENDER_DRIVER=software \
            -e SDL_AUDIO_DRIVER=dummy \
            ubuntu:24.04 bash -c '
              set -e
              for t in gcc cc cmake ninja make; do
                if command -v $t >/dev/null; then
                  echo "::error::$t is present - this is not a clean machine"
                  exit 1
                fi
              done
              tar xzf /pkg/gearstick-*-linux-*.tar.gz -C /tmp
              cd /tmp/gearstick-*
              ldd ./gearstick
              ./gearstick_cli selftest --verify
              ./gearstick --shot packaged.bmp --shot-at 120
              test -s packaged.bmp
              echo "the release runs where nothing was ever built"
            '

      - uses: actions/upload-artifact@v4
        with:
          name: gearstick-linux-x86_64
          path: build/gearstick-*.tar.gz*

  macos:
    name: macOS arm64 disk image
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with: { submodules: false }
      - run: git submodule update --init --depth 1 $CI_SUBMODULES

      - name: Install ninja
        run: brew install ninja
      - name: Use the newest Xcode on the image
        run: |
          latest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest"; fi

      - name: Build and package
        run: |
          rel="${GS_RELEASE#v}"
          extra=""
          if [ -n "$rel" ]; then extra="-DGEARSTICK_RELEASE=$rel"; fi
          echo "naming this release: ${rel:-the project version}"
          cmake --preset macos-release $extra
          cmake --build --preset macos-release -j
          cd build/macos-release && cpack

      - name: Unpack somewhere else and run it
        env:
          SDL_VIDEODRIVER: dummy
          SDL_RENDER_DRIVER: software
          SDL_AUDIO_DRIVER: dummy
        run: |
          mkdir -p /tmp/unpacked
          tar xzf build/macos-release/gearstick-*-macos-*.tar.gz -C /tmp/unpacked
          cd /tmp/unpacked/gearstick-*
          ls -la
          ./gearstick_cli selftest --verify
          # The game is a bundle, and its assets live in Contents/Resources -
          # which is precisely what SDL_GetBasePath hands back, so this is the
          # step that proves the bundle layout and the path probe agree.
          ./gearstick.app/Contents/MacOS/gearstick --shot packaged.bmp --shot-at 120
          test -s packaged.bmp || { echo "the packaged game drew nothing"; exit 1; }

      # The disk image is what a person actually downloads, so check it mounts
      # and carries the app rather than trusting that cpack made one.
      - name: Mount the disk image
        run: |
          dmg=$(ls build/macos-release/gearstick-*.dmg)
          hdiutil attach "$dmg" -mountpoint /Volumes/gearstick-check -nobrowse
          ls -la /Volumes/gearstick-check
          test -d /Volumes/gearstick-check/gearstick.app || {
            echo "the disk image has no app in it"; exit 1; }
          hdiutil detach /Volumes/gearstick-check

      - uses: actions/upload-artifact@v4
        with:
          name: gearstick-macos-arm64
          path: |
            build/macos-release/gearstick-*.tar.gz*
            build/macos-release/gearstick-*.dmg*

  windows:
    name: Windows x64 zip and installer
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with: { submodules: false }
      # Spelled out rather than $CI_SUBMODULES: this job runs under a shell that
      # does not expand it. Add anything new here as well as above.
      - run: git submodule update --init --depth 1 ext/sdl ext/imgui ext/sdl_net ext/libsodium

      - uses: ilammy/msvc-dev-cmd@v1
        with: { arch: x64 }

      # cmd cannot strip the leading `v`, so pwsh does it and hands the answer
      # over through the environment.
      - name: What this release is called
        shell: pwsh
        run: |
          $rel = "${{ env.GS_RELEASE }}" -replace '^v', ''
          $extra = if ($rel) { "-DGEARSTICK_RELEASE=$rel" } else { "" }
          Write-Host "naming this release: $(if ($rel) { $rel } else { 'the project version' })"
          "GS_CMAKE_EXTRA=$extra" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build and package
        shell: cmd
        run: |
          cmake --preset windows-release %GS_CMAKE_EXTRA%
          cmake --build --preset windows-release
          cd build\windows-release && cpack

      # **What WiX said, when WiX is what failed.** CPack prints "check
      # wix.log" and then the job ends and the file goes with the runner. The
      # first MSI build failed exactly this way and the reason - a licence file
      # with no extension - was in a log nobody could read.
      - name: What WiX said
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem -Path build\windows-release\_CPack_Packages -Recurse `
                        -Filter wix.log -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host "--- $($_.FullName)"; Get-Content $_.FullName }

      - name: Unpack somewhere else and run it
        shell: pwsh
        env:
          SDL_VIDEODRIVER: dummy
          SDL_RENDER_DRIVER: software
          SDL_AUDIO_DRIVER: dummy
        run: |
          $zip = Get-ChildItem build\windows-release\gearstick-*.zip | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path C:\unpacked | Out-Null
          Expand-Archive -Path $zip.FullName -DestinationPath C:\unpacked -Force
          $dir = Get-ChildItem C:\unpacked -Directory | Select-Object -First 1
          Set-Location $dir.FullName
          Get-ChildItem
          & .\gearstick_cli.exe selftest --verify
          if ($LASTEXITCODE -ne 0) { throw "the packaged headless driver failed" }
          # gearstick.exe is built for the GUI subsystem, so it detaches and
          # writes nothing to the console. Wait for it, then look at what it
          # produced - the frame on disk is the only evidence either way.
          & .\gearstick.exe --shot packaged.bmp --shot-at 120 | Out-Null
          Start-Sleep -Seconds 5
          if (-not (Test-Path packaged.bmp)) { throw "the packaged game drew nothing" }
          if ((Get-Item packaged.bmp).Length -eq 0) { throw "the frame is empty" }

      # **The installer, installed.** A zip proves the layout is one the asset
      # probe can find; it proves nothing about an MSI, which puts files
      # somewhere else, writes a Start Menu entry and has to be able to take all
      # of it away again.
      #
      # This runner is not the "machine that has never had a toolchain" the plan
      # asks for - it is the machine that just built the thing. What it does
      # establish is that the MSI installs, that what it installed runs, and
      # that uninstalling leaves nothing: the parts that are about the installer
      # rather than about the machine. Said plainly rather than counted as the
      # whole verification.
      - name: Install the MSI, run what it installed, and uninstall it
        shell: pwsh
        env:
          SDL_VIDEODRIVER: dummy
          SDL_RENDER_DRIVER: software
          SDL_AUDIO_DRIVER: dummy
        run: |
          $msi = Get-ChildItem build\windows-release\gearstick-*.msi | Select-Object -First 1
          if (-not $msi) { throw "cpack produced no MSI" }
          Write-Host "installer: $($msi.Name), $([math]::Round($msi.Length/1MB,1)) MB"

          $target = "C:\gs-installed"
          $log = "install.log"
          $p = Start-Process msiexec.exe -Wait -PassThru -ArgumentList `
               "/i", "`"$($msi.FullName)`"", "/qn", "/norestart", `
               "INSTALL_ROOT=$target", "/l*v", $log
          if ($p.ExitCode -ne 0) {
            Get-Content $log -Tail 40
            throw "msiexec install failed with $($p.ExitCode)"
          }

          # Wherever it went. INSTALL_ROOT is honoured by CPack's WiX template,
          # but finding the executable rather than assuming the path is what
          # makes this a test of the installer instead of a test of my guess.
          $exe = Get-ChildItem -Path C:\ -Recurse -Filter gearstick_cli.exe `
                 -ErrorAction SilentlyContinue |
                 Where-Object { $_.FullName -notlike "*\build\*" } |
                 Select-Object -First 1
          if (-not $exe) { throw "nothing called gearstick_cli.exe was installed" }
          $root = $exe.Directory.FullName
          Write-Host "installed into $root"

          # **The assets went too.** An installer that lays down executables and
          # forgets the data is one that fails on somebody else's machine and
          # not here, because here the build tree is still lying about.
          if (-not (Test-Path (Join-Path $root "assets"))) {
            Get-ChildItem $root
            throw "the installer left the assets behind"
          }

          Push-Location $root
          & .\gearstick_cli.exe selftest --verify
          if ($LASTEXITCODE -ne 0) { throw "the installed headless driver failed" }

          # **Nothing from a toolchain, which is the part of "a clean machine"
          # that actually bites on Windows.** MSVC links the dynamic C runtime
          # by default, and an executable that needs VCRUNTIME140.dll starts
          # fine here - the runner has Visual Studio - and does not start at all
          # for somebody who has never installed it. The zip cannot fix that
          # even in principle, so the runtime is linked statically and this is
          # the check that says it stayed that way.
          $deps = & dumpbin /dependents .\gearstick.exe 2>$null
          if ($LASTEXITCODE -ne 0) { throw "could not read gearstick.exe's imports" }
          $redist = $deps | Select-String -Pattern "VCRUNTIME|MSVCP|api-ms-win-crt"
          if ($redist) {
            $deps | Select-String -Pattern "\.dll"
            throw "the installed game wants the Visual C++ redistributable: $redist"
          }
          Write-Host "  imports no redistributable - it starts on a machine that has never had one"
          Pop-Location

          # **The Start Menu entry, in either of the two places it can be.**
          # A per-machine install puts it under ProgramData and a per-user one
          # under the user's AppData, and which you get depends on how msiexec
          # was invoked. Looking in only one of them is how this check failed
          # the first time - a wrong assumption about a path, reported as a
          # missing shortcut.
          $menus = @(
            "C:\ProgramData\Microsoft\Windows\Start Menu\Programs",
            (Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs")
          )
          $menu = $menus | Where-Object { Test-Path $_ } | ForEach-Object {
              Get-ChildItem $_ -Recurse -Filter "*.lnk" -ErrorAction SilentlyContinue
          } | Where-Object { $_.Name -like "*earstick*" }

          if (-not $menu) {
            Write-Host "no gearstick shortcut; here is what is there:"
            $menus | Where-Object { Test-Path $_ } | ForEach-Object {
                Write-Host "--- $_"
                Get-ChildItem $_ -Recurse -Filter "*.lnk" -ErrorAction SilentlyContinue |
                  ForEach-Object { Write-Host "    $($_.FullName)" }
            }
            throw "no Start Menu shortcut was created"
          }
          Write-Host "start menu: $($menu[0].FullName)"

          # **And the shortcut is launched, not merely counted.** The plan says
          # "the game runs from the Start Menu"; a shortcut that exists and
          # points at nothing satisfies a file-exists check and not a player.
          # The game is a GUI-subsystem program, so it detaches and writes
          # nothing to the console - the frame on disk is the only evidence
          # either way, and the shortcut carries no arguments, so the working
          # directory is where the frame lands.
          $shell = New-Object -ComObject WScript.Shell
          $link = $shell.CreateShortcut($menu[0].FullName)
          Write-Host "  it points at: $($link.TargetPath)"
          if (-not (Test-Path $link.TargetPath)) {
            throw "the Start Menu shortcut points at nothing"
          }

          $before = Get-Date
          Start-Process -FilePath $menu[0].FullName
          Start-Sleep -Seconds 8
          $running = Get-Process -Name gearstick -ErrorAction SilentlyContinue
          if (-not $running) {
            throw "launching the Start Menu shortcut started nothing that stayed up"
          }
          Write-Host "  launched from the shortcut, pid $($running.Id), " +
                     "up for $([int]((Get-Date) - $before).TotalSeconds)s"
          $running | Stop-Process -Force
          Start-Sleep -Seconds 2

          # And away again. **Uninstalling has to leave nothing** - an installer
          # that cannot be removed is one people are right to refuse.
          $p = Start-Process msiexec.exe -Wait -PassThru -ArgumentList `
               "/x", "`"$($msi.FullName)`"", "/qn", "/norestart", "/l*v", "uninstall.log"
          if ($p.ExitCode -ne 0) {
            Get-Content uninstall.log -Tail 40
            throw "msiexec uninstall failed with $($p.ExitCode)"
          }
          if (Test-Path (Join-Path $root "gearstick_cli.exe")) {
            throw "uninstalling left the program behind"
          }
          $left = $menus | Where-Object { Test-Path $_ } | ForEach-Object {
              Get-ChildItem $_ -Recurse -Filter "*.lnk" -ErrorAction SilentlyContinue
          } | Where-Object { $_.Name -like "*earstick*" }
          if ($left) { throw "uninstalling left a Start Menu shortcut behind" }
          Write-Host "installed, ran, and uninstalled cleanly"

      - uses: actions/upload-artifact@v4
        with:
          name: gearstick-windows-x64
          path: |
            build/windows-release/gearstick-*.zip*
            build/windows-release/gearstick-*.msi*

  # ---------------------------------------------------------------------------
  # **A Windows machine that has never had a toolchain on it.**
  #
  # The job above installs the MSI on the runner that just built it, which
  # covers everything about the installer and nothing about the machine. A
  # Windows Server Core container has no Visual Studio, no CMake, no SDL and no
  # Visual C++ redistributable - which is what a player's computer is, and is
  # the last thing between this item and being finished.
  #
  # Its own job rather than a step in the one above, so that if this runner
  # cannot host Windows containers the artifacts are still built and the failure
  # says which of the two things went wrong.
  # ---------------------------------------------------------------------------
  windows-clean-machine:
    name: The installer on a machine with no toolchain
    needs: windows
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with: { submodules: false }
      - uses: actions/download-artifact@v4
        with:
          name: gearstick-windows-x64
          path: dist

      - name: Install and run it where nothing has ever been built
        shell: pwsh
        run: |
          $build = [int](Get-CimInstance Win32_OperatingSystem).BuildNumber
          Write-Host "host build $build"

          # The container image has to match the host for process isolation, so
          # it is chosen from what the host actually is rather than pinned to a
          # guess that rots when the runner image moves.
          $tag = if ($build -ge 26100) { "ltsc2025" }
                 elseif ($build -ge 20348) { "ltsc2022" }
                 else { "ltsc2019" }
          $image = "mcr.microsoft.com/windows/servercore:$tag"
          Write-Host "using $image"

          docker pull $image
          if ($LASTEXITCODE -ne 0) { throw "could not pull $image" }

          docker run --rm `
            -v "${PWD}\dist:C:\dist" `
            -v "${PWD}\tools:C:\tools" `
            -e SDL_VIDEODRIVER=dummy -e SDL_AUDIO_DRIVER=dummy `
            $image powershell -ExecutionPolicy Bypass `
            -File C:\tools\clean_machine_check.ps1
          if ($LASTEXITCODE -ne 0) {
            throw "the installer did not work on a machine with no toolchain"
          }

  # ---------------------------------------------------------------------------
  # Publishing
  #
  # **Unsigned, and provably built here.** Code signing means paying Microsoft's
  # and Apple's certificate authorities so a name is attached to the binary; it
  # says who paid, and nothing about what went in. A build provenance
  # attestation is a signed statement by GitHub's own infrastructure that this
  # exact file came out of this workflow from this commit - which is a stronger
  # claim, is free, and can be checked by anybody with `gh attestation verify`.
  #
  # docs/RELEASES.md says all of this to the person downloading it, along with
  # exactly what SmartScreen and Gatekeeper will say and what to do about it.
  # "Just click through the warning" is terrible advice and this project does
  # not give it.
  # ---------------------------------------------------------------------------
  release:
    name: Publish the release
    # **windows-clean-machine is in this list deliberately.** Without it a
    # release could publish an installer that had just failed on a machine with
    # no toolchain: the three build jobs would be green, the check that matters
    # to a player would be red, and nothing would stop the upload. A gate that
    # does not gate the thing it was written for is worse than none, because it
    # reads as protection.
    needs: [linux, macos, windows, windows-clean-machine]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write        # to create the release
      id-token: write        # to sign the provenance
      attestations: write
    steps:
      - uses: actions/checkout@v5
        with: { submodules: false }

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: One checksum file for the lot
        run: |
          cd dist
          rm -f *.sha256 SHA256SUMS
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Attest what was built
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.dmg
            dist/*.msi

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          # **A beta is marked as one.** Semantic versioning says a hyphen in
          # the version means a pre-release, so `v0.1.0-beta1` is flagged and
          # `v0.1.0` is not - which is what stops a beta being served to
          # somebody who asked for the latest release.
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            ## Gearstick ${{ github.ref_name }}

            **These builds are not code-signed.** Windows and macOS will say so.
            [docs/RELEASES.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/RELEASES.md)
            explains exactly what each will say, what to do about it, and why
            the money went into provenance instead of a certificate.

            Every file here carries a build provenance attestation. Check it:

            ```sh
            gh attestation verify <file> --repo ${{ github.repository }}
            ```

            That confirms the file came out of this repository's CI, from this
            commit, unaltered. A code-signing certificate does not make that
            claim.

            New here? [The player's guide](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/GUIDE.md)
            has the first ten minutes.
