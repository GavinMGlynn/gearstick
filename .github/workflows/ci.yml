name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per branch. Pushing three times in ten minutes was starting three full
# matrices and leaving them to fight over runners, and the older two were
# telling nobody anything the newest would not say better.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# SDL, its networking satellite, and Dear ImGui. Nothing else is checked out,
# which is also what keeps README.md honest: a clone with these submodules
# builds and runs.
env:
  # ext/imgui too, now that the editor's panels are built on it. NOT
  # ext/dear_bindings: it generates the C API and the result is committed, so
  # building needs the header but not the generator. That asymmetry is the whole
  # point of committing the bindings, and this line is where it shows.
  #
  # NOT ext/imgui_styles either: it is a reference that was read while writing
  # the front end's look, and nothing builds or links it.
  #
  # ext/sdl_net carries the datagram socket the rollback netcode sends over. It
  # is a separate library from SDL because networking is a separate library from
  # SDL, and no distribution packages the SDL3 version yet, so the submodule is
  # not merely a convenience here.
  CI_SUBMODULES: ext/sdl ext/imgui ext/sdl_net ext/libsodium

jobs:
  linux-debian:
    name: Linux x86_64 (GCC 14, Debian family)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with: { submodules: false }
      - name: Check out build submodules
        run: git submodule update --init --depth 1 $CI_SUBMODULES

      # The list is SDL's own, from docs/README-linux.md at the pinned tag.
      # XTEST and XScrnSaver are not optional extras: SDL calls
      # SDL_missing_dependency() and fails the configure outright without them,
      # naming a -D flag rather than a package. Worth knowing before deciding
      # they look skippable.
      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # The runner image ships third-party apt sources - Microsoft, Google
          # Chrome - that this build has no use for. Globbed by name rather than
          # by filename, because the first attempt removed `google-chrome.list`
          # and the image had already moved to deb822 `.sources`; it looked
          # fixed and dl.google.com was still being fetched the next run.
          sudo rm -f /etc/apt/sources.list.d/*google* \
                     /etc/apt/sources.list.d/*microsoft* \
                     /etc/apt/sources.list.d/*azure* 2>/dev/null || true

          # The runner's own background apt jobs hold the dpkg lock and are a
          # documented cause of exactly this stall. They have nothing useful to
          # do while a build runs.
          sudo systemctl stop apt-daily.timer apt-daily-upgrade.timer \
                              unattended-upgrades.service 2>/dev/null || true

          # apt on GitHub's hosted runners stalls indefinitely, intermittently,
          # and it is their bug rather than ours - actions/runner-images#11382.
          # Two rounds of tuning Acquire options is how that was established:
          # timeouts, retries and ForceIPv4 were all still hanging. So it is
          # bounded from the outside and retried, which is the handling that
          # issue recommends and the only thing that works against a hang rather
          # than against a slow mirror.
          APT_OPTS="-o Acquire::Retries=3 \
                    -o Acquire::http::Timeout=30 \
                    -o Acquire::https::Timeout=30 \
                    -o Acquire::ForceIPv4=true \
                    -o DPkg::Lock::Timeout=60"

          apt_run() {
            for attempt in 1 2 3; do
              if sudo timeout 240 apt-get $APT_OPTS "$@"; then return 0; fi
              echo "::warning::apt attempt $attempt stalled; killing it and retrying"
              sudo pkill -9 -f apt-get 2>/dev/null || true
              sudo pkill -9 -f dpkg 2>/dev/null || true
              sudo rm -f /var/lib/apt/lists/lock /var/lib/dpkg/lock \
                         /var/lib/dpkg/lock-frontend 2>/dev/null || true
              sudo dpkg --configure -a 2>/dev/null || true
              sleep 10
            done
            echo "::error::apt would not complete in three attempts"
            return 1
          }

          apt_run update
          apt_run install -y --no-install-recommends \
            gcc-14 g++-14 ninja-build \
            libx11-dev libxext-dev libxrandr-dev libxi-dev libxcursor-dev \
            libxfixes-dev libxss-dev libxtst-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libdecor-0-dev \
            libgl-dev libegl-dev libdrm-dev libgbm-dev \
            libpulse-dev libasound2-dev \
            libdbus-1-dev libudev-dev libusb-1.0-0-dev

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14
                   -DCMAKE_BUILD_TYPE=RelWithDebInfo -DGEARSTICK_WERROR=ON
      - name: Build
        run: cmake --build build -j
      # **The independent implementations.** `tools/noise_interop.py` and
      # `tools/transport_client.py` skip themselves when `noiseprotocol` is
      # missing, and a skipped check for the one piece of evidence that does not
      # rest on our own opinion of our own code is worth nothing - so it is
      # installed here rather than hoped for.
      #
      # `cryptography` is named even though it already arrives on the runner
      # image, because `transport_client.py` imports it *unguarded* - it guards
      # `noiseprotocol` and skips, but a missing `cryptography` is an ImportError
      # and a red job. Depending on what a hosted image happens to preinstall is
      # a dependency either way; this is the version of it that is written down.
      - name: Install the independent implementations
        run: python3 -m pip install --break-system-packages noiseprotocol cryptography

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      # The tests cover the simulation. This covers everything the simulation
      # deliberately cannot touch: the renderer, the camera, the asset path
      # search. A game that passes ctest and cannot draw a frame is still broken.
      - name: Smoke test - render a frame headless
        env:
          SDL_VIDEODRIVER: dummy
          SDL_RENDER_DRIVER: software
          SDL_AUDIO_DRIVER: dummy
        run: |
          ./build/gearstick --shot smoke.bmp --shot-at 420 --overlay
          test -s smoke.bmp || { echo "no frame was written"; exit 1; }

      - name: Upload the frame
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: frame-linux, path: smoke.bmp, if-no-files-found: ignore }


  linux-rhel:
    name: Linux x86_64 (RHEL family)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: rockylinux/rockylinux:10
    steps:
      # Three repositories, and none of it is optional:
      #   AppStream  most of it
      #   CRB        ninja-build, libdecor-devel
      #   EPEL       libXScrnSaver-devel, which exists nowhere else on RHEL 10
      # `--enablerepo=` one-shot rather than `dnf config-manager --set-enabled`,
      # because Rocky 10 ships dnf5 and config-manager's flags changed there.
      #
      # That EPEL line is a real portability fact rather than a CI detail: SDL
      # fails its configure without XScrnSaver, so building this on a stock
      # RHEL-family box needs EPEL too. See ext/README.md.
      - name: Install dependencies
        run: |
          # `install_weak_deps=False` is dnf's `--no-install-recommends`, and
          # leaving it out cost more than anything else in CI: 351 packages and
          # 253 MB into a minimal container, against 56 packages and 8 MB on
          # the Debian side that had been told not to. `nodocs` drops manuals
          # nothing in a container will ever read.
          dnf_opts="--setopt=install_weak_deps=False --setopt=tsflags=nodocs -y"

          # **Rocky's mirrors go away sometimes.** "No URLs in mirrorlist" is a
          # mirror outage rather than anything about this project, and it turns
          # a green tree red for a quarter of an hour at a time. The Debian job
          # has had retry handling for apt since a similar afternoon; this one
          # had none, so a transient failure here looked exactly like a real
          # one. Retried with a growing pause, and the metadata cache is
          # dropped first because a stale mirrorlist is the usual reason the
          # second attempt fails the same way as the first.
          dnf_run() {
            for attempt in 1 2 3 4; do
              if dnf $dnf_opts "$@"; then return 0; fi
              echo "::warning::dnf attempt $attempt failed; clearing the cache and retrying"
              dnf clean all || true
              sleep $((attempt * 15))
            done
            echo "::error::dnf would not complete in four attempts"
            return 1
          }

          dnf_run install epel-release
          dnf_run --enablerepo=crb install git gcc gcc-c++ cmake ninja-build \
            libX11-devel libXext-devel libXrandr-devel libXi-devel \
            libXcursor-devel libXfixes-devel libXScrnSaver-devel libXtst-devel \
            libxkbcommon-devel \
            wayland-devel wayland-protocols-devel libdecor-devel \
            mesa-libGL-devel mesa-libEGL-devel libdrm-devel mesa-libgbm-devel \
            pulseaudio-libs-devel alsa-lib-devel dbus-devel systemd-devel \
            libusb1-devel

      - uses: actions/checkout@v5
        with: { submodules: false }
      - name: Check out build submodules
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git submodule update --init --depth 1 $CI_SUBMODULES

      - name: Configure, build, test
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DGEARSTICK_WERROR=ON
          cmake --build build -j
          ctest --test-dir build --output-on-failure

  macos:
    name: macOS arm64 (AppleClang)
    # macos-15, not macos-14: the 14 image is deprecated and ships AppleClang
    # 15, which is not C23 and is correctly refused by cmake/Platform.cmake.
    # Both images are Apple Silicon, which is the architecture this targets.
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with: { submodules: false }
      - name: Check out build submodules
        run: git submodule update --init --depth 1 $CI_SUBMODULES

      - name: Install ninja
        run: brew install ninja

      # Take the newest Xcode the image carries rather than whichever one it
      # happens to have selected. The compiler gate needs AppleClang 16+, and
      # discovering that the default was older costs a whole CI round trip.
      - name: Use the newest Xcode on the image
        run: |
          latest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest"; fi
          cc --version

      - name: Configure, build, test
        run: |
          cmake --preset macos-release
          cmake --build --preset macos-release -j
          ctest --preset macos-release

      - name: Smoke test - render a frame headless
        env:
          SDL_VIDEODRIVER: dummy
          SDL_RENDER_DRIVER: software
          SDL_AUDIO_DRIVER: dummy
        run: |
          # On macOS the game is a bundle - see the install rules in
          # CMakeLists.txt - so the executable is inside it rather than beside
          # the build directory. Running it directly is fine; SDL_GetBasePath
          # then returns the bundle's resource path, which is exactly what
          # gs_paths.c is written to probe.
          ./build/macos-release/gearstick.app/Contents/MacOS/gearstick \
            --shot smoke.bmp --shot-at 420 --overlay
          test -s smoke.bmp || { echo "no frame was written"; exit 1; }

  windows:
    name: Windows x64 (MSVC)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with: { submodules: false }
      - name: Check out build submodules
        # Spelled out rather than $CI_SUBMODULES: this job runs under a shell
        # that does not expand it, and a silently empty list checks out no
        # submodules at all and fails several minutes later in the configure.
        # **Add anything new here as well as to CI_SUBMODULES above.**
        run: git submodule update --init --depth 1 ext/sdl ext/imgui ext/sdl_net ext/libsodium

      - uses: ilammy/msvc-dev-cmd@v1
        with: { arch: x64 }

      - name: Configure, build, test
        shell: cmd
        run: |
          cmake --preset windows-release
          cmake --build --preset windows-release
          ctest --preset windows-release

  # ---------------------------------------------------------------------------
  # The one that matters most.
  #
  # Every job above runs `gearstick_cli selftest --verify` as part of ctest, and
  # that compares one state hash against a number committed in the source. Four
  # platforms, three compilers and two architectures all landing on the same
  # hash is what turns "the simulation is deterministic" from a design intention
  # into a fact somebody checked. This job exists to say so out loud when they
  # all pass.
  # ---------------------------------------------------------------------------
  # Every byte the server acts on came from somebody who may be hostile: the
  # protocol decoder, the chunked reassembler, and the track and replay
  # deserialisers behind them. They are the part of this program most likely to
  # contain a memory-safety bug and they are reachable from the network by
  # anybody, so they are fed rubbish here rather than only well-formed input.
  #
  # The corpus is generated rather than committed - by the same code the game
  # builds its messages with - so a seed cannot quietly stop being a sample of
  # the format it is supposed to be a sample of.
  #
  # The dependency install below is the Debian job's, repeated. It is duplicated
  # rather than shared because clang is a different toolchain on the same image
  # and factoring it out would mean editing a job that is green; the duplication
  # is the cheaper of the two mistakes.
  # ---------------------------------------------------------------------------
  fuzz:
    name: The parsers, fed rubbish (clang, ASan + UBSan)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with: { submodules: false }
      - name: Check out build submodules
        run: git submodule update --init --depth 1 $CI_SUBMODULES

      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -f /etc/apt/sources.list.d/*google* \
                     /etc/apt/sources.list.d/*microsoft* \
                     /etc/apt/sources.list.d/*azure* 2>/dev/null || true
          sudo systemctl stop apt-daily.timer apt-daily-upgrade.timer \
                              unattended-upgrades.service 2>/dev/null || true

          APT_OPTS="-o Acquire::Retries=3 \
                    -o Acquire::http::Timeout=30 \
                    -o Acquire::https::Timeout=30 \
                    -o Acquire::ForceIPv4=true \
                    -o DPkg::Lock::Timeout=60"

          apt_run() {
            for attempt in 1 2 3; do
              if sudo timeout 240 apt-get $APT_OPTS "$@"; then return 0; fi
              echo "::warning::apt attempt $attempt stalled; killing it and retrying"
              sudo pkill -9 -f apt-get 2>/dev/null || true
              sudo pkill -9 -f dpkg 2>/dev/null || true
              sudo rm -f /var/lib/apt/lists/lock /var/lib/dpkg/lock \
                         /var/lib/dpkg/lock-frontend 2>/dev/null || true
              sudo dpkg --configure -a 2>/dev/null || true
              sleep 10
            done
            echo "::error::apt would not complete in three attempts"
            return 1
          }

          apt_run update
          # **clang-19, not clang.** The runner's default is 18, which is below
          # this project's C23 floor - and the configure says so and stops,
          # which is the gate doing its job and not a thing to work around.
          # `libclang-rt-19-dev` is not optional here: libFuzzer, ASan and
          # UBSan all live in clang's runtime library, and without it the
          # targets compile and then fail at the link with three missing .a
          # files - which reads as a build problem and is a missing package.
          apt_run install -y --no-install-recommends \
            clang-19 libclang-rt-19-dev ninja-build \
            libx11-dev libxext-dev libxrandr-dev libxi-dev libxcursor-dev \
            libxfixes-dev libxss-dev libxtst-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libdecor-0-dev \
            libgl-dev libegl-dev libdrm-dev libgbm-dev \
            libpulse-dev libasound2-dev \
            libdbus-1-dev libudev-dev libusb-1.0-0-dev

      - name: Configure
        run: cmake -B build-fuzz -G Ninja -DCMAKE_C_COMPILER=clang-19
                   -DCMAKE_BUILD_TYPE=Debug -DGEARSTICK_FUZZ=ON

      # Only the fuzz targets. They link the simulation and the protocol and
      # nothing else - no SDL, no window, no sockets - which is the same
      # property gearstick_cli exists to prove, collected again.
      - name: Build the fuzz targets
        run: |
          # **Every target, named.** A target added to CMake and forgotten here
          # builds nothing, and the ctest entry then fails with "no such file"
          # - which is what happened to the noise fuzzer and took a round trip
          # to see, because the runner's output was being discarded.
          cmake --build build-fuzz -j --target \
            gearstick_fuzz_seeds gearstick_fuzz_proto gearstick_fuzz_carrier \
            gearstick_fuzz_track gearstick_fuzz_replay gearstick_fuzz_noise

      # The regression half: every seed through every parser under the
      # sanitizers, as a fixed amount of work. This is what must never go red.
      - name: The seed corpus, through every parser
        run: ctest --test-dir build-fuzz -R gearstick_fuzz --output-on-failure

      # And the campaign. A time budget rather than a work budget, because this
      # half is looking for something new rather than checking something known.
      - name: A campaign per parser
        run: |
          set -e
          for t in proto carrier track replay noise; do
            dir="build-fuzz/campaign/$t"
            rm -rf "$dir"; mkdir -p "$dir"
            ./build-fuzz/gearstick_fuzz_seeds "$t" "$dir"
            echo "::group::$t"
            ./build-fuzz/"gearstick_fuzz_$t" "$dir" "-dict=$dir.dict" \
              -max_total_time=120 -print_final_stats=1
            echo "::endgroup::"
          done

      # A crash is a file libFuzzer drops in the working directory, and it is
      # the input that caused it - which is the whole report, reproducible with
      # one command.
      - name: Keep anything that crashed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-findings
          path: |
            crash-*
            leak-*
            timeout-*
            oom-*
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  determinism:
    name: The same race everywhere
    needs: [linux-debian, linux-rhel, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Say it
        run: echo "Every platform re-raced the golden replay to the same state hash."
